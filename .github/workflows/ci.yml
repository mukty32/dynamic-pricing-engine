# Continuous Integration: every push and pull request is checked automatically on GitHub.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint, format & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Formatting (ruff format)
        run: ruff format --check .
      - name: Type check (mypy)
        run: mypy

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (fail if coverage drops below 90%)
        run: pytest -q --cov --cov-report=term --cov-fail-under=90

  docker:
    name: Docker build
    needs: [quality, test]  # only build images if everything above passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API and dashboard images (this also trains the model)
        run: docker compose build
      - name: Build the single-container demo image
        run: docker build -f docker/demo.Dockerfile -t dynamic-pricing-demo .
